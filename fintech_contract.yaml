#
# DATA CONTRACT: FinTech Transaction Log
#
# NEGOTIATION SUMMARY
# Producer: Payments Data Engineering Team
# Consumer: Fraud Detection System
#
# Agreed Terms:
# 1. Account IDs must be exactly 10 uppercase alphanumeric characters (hard circuit breaker)
# 2. All rules are hard-enforced due to financial regulatory requirements
# 3. Hard enforcement ensures invalid records blocked at ingestion
#
dataContractSpecification: 0.9.3
id: urn:datacontract:fintech:transaction-log
version: 1.0.0

info:
  title: "Fraud Detection Transaction Stream"
  description: "Real-time transaction log for fraud analysis. Contains financial transactions subject to regulatory oversight."
  owner: "Payments Team"
  contact:
    name: "Fraud Data Steward"
    email: "fraud-data@fintech.com"
    slack: "#fraud-detection"
  classification: confidential
  tags: [fintech, transactions, fraud, regulatory, compliance]

schema:
  type: object
  properties:
    account_source_id:
      type: string
      pattern: "^[A-Z0-9]{10}$"
      description: "Source Account ID. Must be exactly 10 uppercase alphanumeric characters (A-Z, 0-9 only)."
      pii: false
      # physical_mapping: acct_src
    account_dest_id:
      type: string
      pattern: "^[A-Z0-9]{10}$"
      description: "Destination Account ID. Must be exactly 10 uppercase alphanumeric characters."
      pii: false
      # physical_mapping: acct_dest
    transaction_timestamp:
      type: string
      format: date-time
      description: "Time of transaction in UTC."
      pii: false
      # physical_mapping: tx_ts
    transaction_amount_usd:
      type: number
      minimum: 0.01
      description: "Transaction amount in USD. Must be positive."
      pii: false
      # physical_mapping: tx_amt
  required:
    - account_source_id
    - account_dest_id
    - transaction_timestamp
    - transaction_amount_usd

sla:
  freshness:
    threshold: "5 minutes"
    description: "Data available within 5 minutes of transaction for real-time fraud detection"
  availability:
    percentage: "99.99%"
    description: "Critical system uptime requirement"
  retention:
    period: "7 years"
    description: "Regulatory requirement for financial records"

quality:
  - name: acct_src_format
    type: validity
    expression: "REGEXP_LIKE(account_source_id, '^[A-Z0-9]{10}$')"
    threshold: "100%"
    enforcement: hard
    description: "HARD CIRCUIT BREAKER: Source account ID must match 10-char alphanumeric pattern (A-Z, 0-9 only)."
  - name: acct_dest_format
    type: validity
    expression: "REGEXP_LIKE(account_dest_id, '^[A-Z0-9]{10}$')"
    threshold: "100%"
    enforcement: hard
    description: "HARD CIRCUIT BREAKER: Destination account ID must match 10-char alphanumeric pattern."
  - name: transaction_amount_positive
    type: validity
    expression: "transaction_amount_usd > 0"
    threshold: "100%"
    enforcement: hard
    description: "Transaction amount must be positive (no zero or negative amounts)."
  - name: accounts_different
    type: validity
    expression: "account_source_id != account_dest_id"
    threshold: "100%"
    enforcement: hard
    description: "Source and destination accounts must be different."

lineage:
  sources:
    - name: payment_processor_db
      type: postgresql
      description: "Core payment processing database"
  consumers:
    - name: fraud-detection-model
      team: risk-team
      usage: "Real-time fraud detection and pattern analysis"
    - name: compliance-audit-system
      team: compliance
      usage: "AML and regulatory reporting"